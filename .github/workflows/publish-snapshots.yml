name: Publish indicative snapshots
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: indicative-snapshots
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm snapshots:publish
      - name: Commit only public data
        run: |
          git add apps/web/public/data/indicative-indexes.json apps/web/public/data/hsx-ohlcv.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='hyperstrike-data[bot]' -c user.email='hyperstrike-data[bot]@users.noreply.github.com' commit -m 'data: refresh indicative snapshots'
          git push origin HEAD:main
      # No force-push or automatic conflict resolution: a concurrent main update
      # fails safely. The next run checks out the latest preserved baseline.
