[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
remappings = ['@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/']
via_ir = true
allow_paths = ['../node_modules']

[profile.ci]
fuzz = { runs = 10000 }
verbosity = 3
